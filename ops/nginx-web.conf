server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Flutter verwendet fuer diese zentralen Dateien stabile Dateinamen. Sie
    # muessen bei jedem Aufruf neu validiert werden, damit ein neuer Build und
    # sein Service Worker unmittelbar erkannt werden.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /materialkompass_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Dart verwendet fuer verzögert geladene Bibliotheken stabile Dateinamen
    # wie main.dart.js_1.part.js. Diese Dateien duerfen nicht unveraenderlich
    # gecacht werden, weil ein neuer main.dart.js sonst alte Bereichs-Chunks
    # aus dem Browser-Cache ausfuehrt.
    location ~ ^/main\.dart\.js_[0-9]+\.part\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
