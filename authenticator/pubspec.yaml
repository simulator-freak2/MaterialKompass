name: materialkompass_authenticator
description: Eigenständiger, selbst gehosteter 2FA-Authenticator für MaterialKompass.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  mobile_scanner: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
