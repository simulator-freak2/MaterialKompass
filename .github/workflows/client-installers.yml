name: Client-Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Client-Version ohne v
        required: true
        default: 1.4.1
      api_base_url:
        description: Produktive HTTPS-API-Adresse
        required: true
        default: https://materialkompass.org

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Windows-Signaturzertifikat importieren
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            Write-Host "WARNUNG: Windows-Signatursecrets fehlen; der Build wird unsigniert erzeugt."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "materialkompass-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Windows-Installer bauen
        shell: pwsh
        run: |
          $parameters = @{
            ApiBaseUrl = '${{ inputs.api_base_url }}'
            Version = '${{ inputs.version }}'
          }
          if (-not $env:WINDOWS_CERT_THUMBPRINT) {
            $parameters.AllowUnsigned = $true
          }
          ./packaging/windows/build_installer.ps1 @parameters
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialKompass-Windows
          path: releases/MaterialKompass-Windows.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux-Buildabhängigkeiten installieren
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: DEB-Installer bauen
        run: bash packaging/linux/build_deb.sh '${{ inputs.api_base_url }}' '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialKompass-Linux
          path: releases/MaterialKompass-Linux.deb

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: macOS-Signaturzertifikat importieren
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "WARNUNG: macOS-Signatursecrets fehlen; der Build wird unsigniert erzeugt."
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/materialkompass-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/materialkompass-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: macOS-DMG bauen
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos/build_dmg.sh '${{ inputs.api_base_url }}'
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialKompass-macOS
          path: releases/MaterialKompass-macOS.dmg

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: iOS-Prüf-Build ohne Signatur bauen
        run: bash packaging/ios/build_unsigned_app.sh '${{ inputs.api_base_url }}'
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialKompass-iOS-unsigned
          path: releases/MaterialKompass-iOS-unsigned.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Webanwendung bauen
        working-directory: flutter
        run: |
          flutter pub get
          flutter build web --release --dart-define='API_BASE_URL=${{ inputs.api_base_url }}'
      - name: Web-Artefakt verpacken
        run: |
          mkdir -p releases
          cd flutter/build/web
          zip -r ../../../releases/MaterialKompass-Web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialKompass-Web
          path: releases/MaterialKompass-Web.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android-Signatur einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 fehlt"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > flutter/android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > flutter/android/key.properties
      - name: Android-Installer bauen
        working-directory: flutter
        run: |
          flutter pub get
          flutter build apk --release --dart-define='API_BASE_URL=${{ inputs.api_base_url }}'
          cp build/app/outputs/flutter-apk/app-release.apk ../releases/MaterialKompass-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialKompass-Android
          path: releases/MaterialKompass-Android.apk
