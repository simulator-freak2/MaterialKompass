name: materialkompass
version: 1.3.0+4
publish_to: 'none'
description: MaterialKompass for DLRG material management.
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  barcode_widget: ^2.0.4
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^11.0.2
  file_saver: ^0.4.0
  flutter_secure_storage: ^9.2.4
  http: ^1.2.0
  mobile_scanner: ^7.2.1
  open_filex: ^4.7.0
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/materialkompass_logo_mit_schriftzug.png
