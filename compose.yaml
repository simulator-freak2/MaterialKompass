services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - materialkompass_db:/var/lib/mysql
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DOWNLOAD_WINDOWS_PATH: /app/downloads/MaterialKompass-Windows.exe
      DOWNLOAD_LINUX_PATH: /app/downloads/MaterialKompass-Linux.deb
      DOWNLOAD_ANDROID_PATH: /app/downloads/MaterialKompass-Android.apk
      CLIENT_WINDOWS_VERSION: ${CLIENT_WINDOWS_VERSION:-1.0.0}
      CLIENT_LINUX_VERSION: ${CLIENT_LINUX_VERSION:-1.0.0}
      CLIENT_ANDROID_VERSION: ${CLIENT_ANDROID_VERSION:-1.0.0}
      CLIENT_WINDOWS_MIN_VERSION: ${CLIENT_WINDOWS_MIN_VERSION:-1.0.0}
      CLIENT_LINUX_MIN_VERSION: ${CLIENT_LINUX_MIN_VERSION:-1.0.0}
      CLIENT_ANDROID_MIN_VERSION: ${CLIENT_ANDROID_MIN_VERSION:-1.0.0}
      CLIENT_UPDATE_NOTES: ${CLIENT_UPDATE_NOTES:-}
    volumes:
      - ./releases:/app/downloads:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  materialkompass_db:
    name: ${DB_VOLUME_NAME:-materialkompass_db_data}
